<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2b"><title>Control de Gastos | Iglesia Emaús</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body><header class="hero"><div class="logo"><div class="mountains">⌁</div><div class="cross">✝</div></div><div><h1>Iglesia Emaús</h1><p>Control de Gastos</p></div></header>
<main><section class="summary"><div><small>Gastos del período</small><strong id="total">$0.00</strong></div><button id="exportBtn">Exportar a Excel</button></section>
<section class="card"><h2>Registrar gasto</h2><form id="expenseForm"><label>Fecha<input id="date" type="date" required></label><label>Gasto / importe<input id="amount" type="number" min="0" step="0.01" placeholder="$0.00" required></label><label>Concepto o actividad<input id="concept" type="text" placeholder="Ej. Material para reunión" required></label><label>Quién recibe<input id="recipient" type="text" placeholder="Nombre de la persona" required></label><label>Nota o recibo<textarea id="note" rows="3" placeholder="Folio, descripción o referencia del recibo"></textarea></label><button class="primary" type="submit">Guardar gasto</button></form></section>
<section class="card"><div class="section-head"><h2>Movimientos</h2><div class="period"><input id="from" type="date" aria-label="Desde"><span>a</span><input id="to" type="date" aria-label="Hasta"></div></div><div id="empty" class="empty">Aún no hay gastos registrados.</div><div id="list"></div></section></main>
<footer>Iglesia Emaús · Administración</footer><script src="app.js"></script></body></html>
